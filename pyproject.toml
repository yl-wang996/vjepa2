[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa2"
version = "0.0.2"
description = "PyTorch code and models for V-JEPA 2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2",
    "torchvision",
    "tensorboard",
    "wandb",
    "iopath",
    "pyyaml",
    "numpy",
    "opencv-python",
    "submitit",
    "braceexpand",
    "webdataset",
    "timm",
    "transformers",
    "peft",
    "decord",
    "pandas",
    "einops",
    "beartype",
    "psutil",
    "h5py",
    "fire",
    "python-box",
    "scikit-image",
    "ftfy",
    "jupyter",
    "scipy",
    "matplotlib",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/facebookresearch/vjepa2"

[dependency-groups]
dev = [
    "black==26.3.1",
    "flake8==7.0.0",
    "isort==5.13.2",
]

[tool.uv]
package = true

[tool.isort]
profile="black"
line_length=119

[tool.black]
line-length = 119
